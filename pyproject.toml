[project]
name = "wowza-streaming-mcp-server"

version = "0.1.0"
description = "Wowza Streaming Engine MCP Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.0",
    "fastmcp>=2.12.4",
    "requests>=2.32.5",
    "python-dotenv>=1.1.1",
    "httpx>=0.28.1",
    "pydantic>=2.12.0",
    "python-multipart>=0.0.20",
    "starlette>=0.48.0",
    "authlib>=1.6.5",
    "uvicorn>=0.37.0",
    "google-adk>=1.16.0",
    "litellm>=1.77.7",
]

[tool.setuptools]
packages = ["api_client", "middleware", "prompts", "tools", "models"]
dependencies = [
    "aiohttp>=3.13.0",
    "authlib>=1.6.5",
    "fastmcp>=2.12.4",
    "httpx>=0.28.1",
    "pydantic>=2.12.0",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "starlette>=0.48.0",
    "uvicorn>=0.37.0",
]
